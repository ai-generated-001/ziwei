services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ziwei-backend
    expose:
      - "5074"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - OpenRouter__ApiKey=${OPENROUTER_API_KEY:-YOUR_OPENROUTER_API_KEY_HERE}
      - OpenRouter__BaseUrl=https://openrouter.ai/api/v1/
    restart: always

  frontend:
    build:
      context: ./ziwei
      dockerfile: Dockerfile
    container_name: ziwei-frontend
    expose:
      - "80"
    restart: always

  proxy:
    image: nginx:alpine
    container_name: ziwei-proxy
    ports:
      - "8080:80"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always
